[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colpack"
version = "0.1.0"
description = "ColPackAgent core simulation package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.26",
	"gsd>=3.0",
    "hoomd>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]


[project.scripts]
colpack-mcp = "colpack.mcp.server:main"